name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    environment: release
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve build settings
        id: settings
        run: |
          tag="${GITHUB_REF_NAME}"
          cxx_standard=17
          bzip2=ON
          cache_scope=hpx-1.11
          if [[ "${tag}" == v2.* ]]; then
            cxx_standard=20
            bzip2=OFF
            cache_scope=hpx-2.0
          fi
          echo "hpx_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "cxx_standard=${cxx_standard}" >> "$GITHUB_OUTPUT"
          echo "bzip2=${bzip2}" >> "$GITHUB_OUTPUT"
          echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/hpx-builder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Publish to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hpx-builder.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            HPX_TAG=${{ steps.settings.outputs.hpx_tag }}
            HPX_BUILD_TYPE=Release
            HPX_CXX_STANDARD=${{ steps.settings.outputs.cxx_standard }}
            HPX_COMPRESSION_BZIP2=${{ steps.settings.outputs.bzip2 }}
            HPX_BUILD_JOBS=4
            HPX_IMAGE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.settings.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.settings.outputs.cache_scope }}

      # GHCR is published before the Docker Hub login so that a Docker Hub
      # credential problem cannot block the GHCR release.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker Hub
        id: meta-dockerhub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/hpx-builder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Publish to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hpx-builder.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            HPX_TAG=${{ steps.settings.outputs.hpx_tag }}
            HPX_BUILD_TYPE=Release
            HPX_CXX_STANDARD=${{ steps.settings.outputs.cxx_standard }}
            HPX_COMPRESSION_BZIP2=${{ steps.settings.outputs.bzip2 }}
            HPX_BUILD_JOBS=4
            HPX_IMAGE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.settings.outputs.cache_scope }}

  release:
    name: Create GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create release from the signed tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-from-tag \
            ${prerelease}
