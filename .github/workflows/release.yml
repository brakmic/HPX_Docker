name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve build settings
        id: settings
        run: |
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          major_minor="${version%.*}"
          stable=1
          if [[ "${tag}" == *-* ]]; then
            stable=0
          fi
          cxx_standard=17
          bzip2=ON
          cache_scope=hpx-1.11
          if [[ "${tag}" == v2.* ]]; then
            cxx_standard=20
            bzip2=OFF
            cache_scope=hpx-2.0
          fi
          revision="$(git rev-parse HEAD)"
          {
            echo "hpx_tag=${tag}"
            echo "version=${version}"
            echo "major_minor=${major_minor}"
            echo "stable=${stable}"
            echo "revision=${revision}"
            echo "cxx_standard=${cxx_standard}"
            echo "bzip2=${bzip2}"
            echo "cache_scope=${cache_scope}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/hpx-builder
          tags: |
            type=raw,value=${{ steps.settings.outputs.version }}
            type=raw,value=${{ steps.settings.outputs.major_minor }}
            type=raw,value=${{ steps.settings.outputs.hpx_tag }}
            type=raw,value=latest,enable=${{ steps.settings.outputs.stable == '1' }}

      - name: Publish to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hpx-builder.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            HPX_TAG=${{ steps.settings.outputs.hpx_tag }}
            HPX_BUILD_TYPE=Release
            HPX_CXX_STANDARD=${{ steps.settings.outputs.cxx_standard }}
            HPX_COMPRESSION_BZIP2=${{ steps.settings.outputs.bzip2 }}
            HPX_BUILD_JOBS=4
            HPX_IMAGE_REVISION=${{ steps.settings.outputs.revision }}
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: |
            ${{ steps.meta-ghcr.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.settings.outputs.revision }}
          cache-from: type=gha,scope=${{ steps.settings.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.settings.outputs.cache_scope }}

      # GHCR is published before the Docker Hub login so that a Docker Hub
      # credential problem cannot block the GHCR release.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker Hub
        id: meta-dockerhub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/hpx-builder
          tags: |
            type=raw,value=${{ steps.settings.outputs.version }}
            type=raw,value=${{ steps.settings.outputs.major_minor }}
            type=raw,value=${{ steps.settings.outputs.hpx_tag }}
            type=raw,value=latest,enable=${{ steps.settings.outputs.stable == '1' }}

      - name: Publish to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hpx-builder.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            HPX_TAG=${{ steps.settings.outputs.hpx_tag }}
            HPX_BUILD_TYPE=Release
            HPX_CXX_STANDARD=${{ steps.settings.outputs.cxx_standard }}
            HPX_COMPRESSION_BZIP2=${{ steps.settings.outputs.bzip2 }}
            HPX_BUILD_JOBS=4
            HPX_IMAGE_REVISION=${{ steps.settings.outputs.revision }}
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: |
            ${{ steps.meta-dockerhub.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.settings.outputs.revision }}
          cache-from: type=gha,scope=${{ steps.settings.outputs.cache_scope }}

  runtime:
    name: Publish runtime images
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve build settings
        id: settings
        run: |
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          major_minor="${version%.*}"
          stable=1
          if [[ "${tag}" == *-* ]]; then
            stable=0
          fi
          revision="$(git rev-parse HEAD)"
          {
            echo "hpx_tag=${tag}"
            echo "version=${version}"
            echo "major_minor=${major_minor}"
            echo "stable=${stable}"
            echo "revision=${revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/hpx-builder
          tags: |
            type=raw,value=${{ steps.settings.outputs.version }}-runtime
            type=raw,value=${{ steps.settings.outputs.major_minor }}-runtime
            type=raw,value=latest-runtime,enable=${{ steps.settings.outputs.stable == '1' }}

      - name: Publish runtime to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hpx-runtime.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            HPX_BUILDER_IMAGE=ghcr.io/${{ github.repository_owner }}/hpx-builder
            HPX_VERSION=${{ steps.settings.outputs.hpx_tag }}
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: |
            ${{ steps.meta-ghcr.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.settings.outputs.revision }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker Hub
        id: meta-dockerhub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/hpx-builder
          tags: |
            type=raw,value=${{ steps.settings.outputs.version }}-runtime
            type=raw,value=${{ steps.settings.outputs.major_minor }}-runtime
            type=raw,value=latest-runtime,enable=${{ steps.settings.outputs.stable == '1' }}

      - name: Publish runtime to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hpx-runtime.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            HPX_BUILDER_IMAGE=ghcr.io/${{ github.repository_owner }}/hpx-builder
            HPX_VERSION=${{ steps.settings.outputs.hpx_tag }}
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: |
            ${{ steps.meta-dockerhub.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.settings.outputs.revision }}

  release:
    name: Create GitHub release
    needs: [publish, runtime]
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Create release from the signed tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --notes-from-tag \
            ${prerelease}
